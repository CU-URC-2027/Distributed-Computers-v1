name: One time source import
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import verified workspace commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/CU-URC-2027/Distributed-Computers-v1.git
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git fetch origin main
          git checkout -B main FETCH_HEAD
          echo '848e576bc420d307cb35c4ab2dae86012687121c73eb9cc87c4b2a38fe12dd0e  workspace-export.bundle' | sha256sum --check
          git fetch ./workspace-export.bundle main
          test "$(git rev-parse FETCH_HEAD)" = e4abe56607aa86eab3774c347d6585aa3cc7d3ed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick FETCH_HEAD
          git rm workspace-export.bundle
          git commit -m 'Remove completed import bundle'
          git push origin HEAD:main
